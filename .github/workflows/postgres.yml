name: PostgreSQL

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: larabase
          POSTGRES_USER: larabase
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U larabase -d larabase"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, dom, exif, fileinfo, gd, intl, mbstring, pdo_pgsql, xml, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env
      - run: php artisan key:generate
      - run: php artisan migrate --seed --force
      - run: >-
          ./vendor/bin/pest
          tests/Feature/Auth
          tests/Feature/Settings
          tests/Feature/Api
          tests/Feature/MediaFolderControllerTest.php
          tests/Feature/UserFileControllerTest.php
          tests/Feature/FileFolderFilteringTest.php
          tests/Feature/ProductionSeederSafetyTest.php
          tests/Feature/PlatformWebCrudTest.php
          tests/Feature/CacheSerializationTest.php
