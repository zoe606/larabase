; =============================================================================
; PHP Configuration - Optimized for 2GB RAM VPS Production
; =============================================================================
; Place this file in the container at /usr/local/etc/php/conf.d/99-custom.ini
; =============================================================================

[PHP]
; Memory limit per script (important for memory management)
memory_limit = 128M

; Maximum execution time (60 seconds is reasonable for web requests)
max_execution_time = 60

; Maximum input time
max_input_time = 60

; Error handling (production settings)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; File uploads
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 10

; Timezone (use UTC, convert in application)
date.timezone = UTC

[opcache]
; Enable OPcache (essential for production performance)
opcache.enable = 1
opcache.enable_cli = 1

; Memory for cached scripts (optimized for 2GB RAM)
opcache.memory_consumption = 64

; Number of cached scripts (sufficient for Laravel app)
opcache.max_accelerated_files = 10000

; Revalidation (disable in production for performance)
opcache.revalidate_freq = 0
opcache.validate_timestamps = 0

; Optimization level
opcache.optimization_level = 0x7FFEBFFF

; Interned strings (for memory efficiency)
opcache.interned_strings_buffer = 16

; Save comments (needed for some Laravel features)
opcache.save_comments = 1

; Fast shutdown
opcache.fast_shutdown = 1

; JIT (PHP 8.4 - enabled for performance)
opcache.jit = 1255
opcache.jit_buffer_size = 32M

[realpath_cache]
; Realpath cache (reduces file system calls)
realpath_cache_size = 4096K
realpath_cache_ttl = 600

[session]
; Session garbage collection (handled by Redis, but set defaults)
session.gc_probability = 1
session.gc_divisor = 100
session.gc_maxlifetime = 7200

[Assertion]
; Disable assertions in production
zend.assertions = -1
