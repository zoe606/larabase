; =============================================================================
; PHP-FPM Pool Configuration - Optimized for 2GB RAM VPS
; =============================================================================
; Place this file in the container at /usr/local/etc/php-fpm.d/zz-custom.conf
; The 'zz-' prefix ensures it loads after default configs and overrides them.
; =============================================================================

; =============================================================================
; NOTE: Do NOT set 'listen' directive here!
; The serversideup/php image handles socket creation in its init scripts.
; We only override process manager settings below.
; =============================================================================

[www]
; Process Manager Configuration
; 'dynamic' allows scaling based on load while respecting memory limits
pm = dynamic

; Maximum number of child processes (main memory saver)
; Each PHP-FPM worker uses ~30-50MB. With 2GB RAM total:
; - OS/system: ~200MB
; - PostgreSQL: ~256MB
; - Redis: ~64MB
; - Nginx: ~50MB
; - Available for PHP-FPM: ~500MB
; Conservative: 5 workers × 100MB = 500MB (with buffer)
pm.max_children = 5

; Workers to start with
pm.start_servers = 2

; Minimum idle workers (keep some ready for requests)
pm.min_spare_servers = 1

; Maximum idle workers (save memory when idle)
pm.max_spare_servers = 3

; Max requests before recycling worker (prevents memory leaks)
pm.max_requests = 500

; Process idle timeout
pm.process_idle_timeout = 10s

; Status endpoint for monitoring
pm.status_path = /fpm-status
ping.path = /fpm-ping

; Logging
catch_workers_output = yes
decorate_workers_output = no

; Request timeouts
request_terminate_timeout = 60s
request_slowlog_timeout = 5s
slowlog = /proc/self/fd/2
