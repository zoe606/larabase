# Local database services for Laravel Herd and OrbStack.
# Start PostgreSQL and Redis: docker compose up -d postgres redis
# Start optional application containers: docker compose --profile container-app up -d --build
# Stop services and retain database volumes: docker compose down

services:
  # ---------------------------------------------------------------------------
  # Application (Laravel + Nginx)
  # ---------------------------------------------------------------------------
  app:
    profiles: [container-app]
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: larabase-app
    restart: unless-stopped
    ports:
      - "8000:8080"
    environment:
      APP_NAME: Larabase
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: larabase_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
    volumes:
      # Mount storage for persistence (optional for local dev)
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Queue Worker
  # ---------------------------------------------------------------------------
  queue:
    profiles: [container-app]
    build:
      context: .
      dockerfile: Dockerfile
      target: queue-worker
    container_name: larabase-queue
    restart: unless-stopped
    environment:
      APP_NAME: Larabase
      APP_KEY: "${APP_KEY:?Set APP_KEY in .env}"
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: larabase_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
    depends_on:
      - app
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: larabase-postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: larabase
      POSTGRES_USER: larabase
      POSTGRES_PASSWORD: larabase_secret
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larabase -d larabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: larabase-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - larabase

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  larabase:
    driver: bridge
