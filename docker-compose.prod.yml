# Larabase production services. Set the required values in the deployment environment.

services:
  # ---------------------------------------------------------------------------
  # Application (Laravel + Nginx)
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
      args:
        VITE_REVERB_APP_KEY: "${REVERB_APP_KEY}"
        VITE_REVERB_HOST: "${REVERB_HOST:-localhost}"
        VITE_REVERB_PORT: "${REVERB_PORT:-443}"
        VITE_REVERB_SCHEME: "${REVERB_SCHEME:-https}"
    container_name: larabase-app
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      # Application
      APP_NAME: Larabase
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      APP_URL: "${APP_URL:?Set APP_URL}"
      APP_TIMEZONE: UTC

      # Database (PostgreSQL)
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "${REDIS_PASSWORD:-null}"

      # Cache, Session, Queue
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb

      # Reverb (WebSocket broadcasting)
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-443}"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"

      # Logging (stderr for Docker)
      LOG_CHANNEL: stderr
      LOG_LEVEL: warning

      # Security
      BCRYPT_ROUNDS: 14
      SANCTUM_STATEFUL_DOMAINS: "${SANCTUM_STATEFUL_DOMAINS:-localhost}"

      # Error Tracking (Sentry)
      SENTRY_LARAVEL_DSN: "${SENTRY_LARAVEL_DSN}"
      SENTRY_TRACES_SAMPLE_RATE: "${SENTRY_TRACES_SAMPLE_RATE:-0}"

      # Mail (configure as needed)
      MAIL_MAILER: log
    volumes:
      - app-storage:/var/www/html/storage/app
      - app-logs:/var/www/html/storage/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Queue Worker
  # ---------------------------------------------------------------------------
  queue:
    build:
      context: .
      dockerfile: Dockerfile
      target: queue-worker
    container_name: larabase-queue
    restart: unless-stopped
    environment:
      APP_NAME: Larabase
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      QUEUE_CONNECTION: redis
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-443}"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"
      LOG_CHANNEL: stderr
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Scheduler (Cron)
  # ---------------------------------------------------------------------------
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: scheduler
    container_name: larabase-scheduler
    restart: unless-stopped
    environment:
      APP_NAME: Larabase
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      LOG_CHANNEL: stderr
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Reverb WebSocket Server
  # ---------------------------------------------------------------------------
  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: reverb
    container_name: larabase-reverb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      APP_NAME: Larabase
      APP_ENV: production
      APP_DEBUG: "false"
      APP_KEY: "${APP_KEY:?Set APP_KEY}"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: larabase
      DB_USERNAME: larabase
      DB_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REVERB_APP_ID: "${REVERB_APP_ID}"
      REVERB_APP_KEY: "${REVERB_APP_KEY}"
      REVERB_APP_SECRET: "${REVERB_APP_SECRET}"
      REVERB_HOST: "${REVERB_HOST:-localhost}"
      REVERB_PORT: "${REVERB_PORT:-443}"
      REVERB_SCHEME: "${REVERB_SCHEME:-https}"
      BROADCAST_CONNECTION: reverb
      LOG_CHANNEL: stderr
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: larabase-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: larabase
      POSTGRES_USER: larabase
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Set DB_PASSWORD}"
      # Performance tuning for small instance
      POSTGRES_SHARED_BUFFERS: 128MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 512MB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U larabase -d larabase"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    networks:
      - larabase

  # ---------------------------------------------------------------------------
  # Redis Cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: larabase-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 64mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 128M
    networks:
      - larabase

# =============================================================================
# Volumes (Persistent Data)
# =============================================================================
volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  app-storage:
    driver: local
  app-logs:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  larabase:
    driver: bridge
